<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a0f">
  <title>楚河棋局｜線上象棋</title>
  <meta name="description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta property="og:title" content="楚河棋局｜線上象棋">
  <meta property="og:description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/index.html">
  <meta property="og:image" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="楚河棋局｜線上象棋">
  <meta name="twitter:description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta name="twitter:image" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/">楚河<span>棋局</span></a>
      <div id="connection" class="connection"><i></i> 連線中</div>
    </header>

    <section id="lobby" class="lobby">
      <div class="intro">
        <p class="eyebrow">ONLINE XIANGQI</p>
        <h1>隔著一條楚河，<br><em>與老友再下一局。</em></h1>
        <p>免註冊、開房即玩。把房間連結傳給朋友，落子之間，重拾面對面對弈的從容。</p>
        <div class="intro-features" aria-label="平台特色"><span>免註冊</span><span>即時同步</span><span>跨裝置對戰</span></div>
      </div>
      <form id="join-form" class="join-card">
        <p class="seal">弈</p>
        <h2>入局</h2>
        <fieldset class="mode-choice">
          <legend>對弈模式</legend>
          <label><input type="radio" name="game-mode" value="online" checked>線上對局</label>
          <label><input type="radio" name="game-mode" value="solo">單機對電腦</label>
        </fieldset>
        <fieldset class="mode-choice variant-choice">
          <legend>棋局規則</legend>
          <label><input type="radio" name="game-variant" value="standard" checked>標準象棋</label>
          <label><input type="radio" name="game-variant" value="jieqi">揭棋模式</label>
        </fieldset>
        <label>你的稱呼<input id="name" maxlength="16" placeholder="例如：棋痴老王" required></label>
        <label id="room-field">房間代碼<input id="room" maxlength="6" placeholder="留空即可建立新房"></label>
        <fieldset class="color-choice">
          <legend>選擇陣營</legend>
          <label><input type="radio" name="preferred-color" value="red" checked><span class="color-disc red">帥</span>紅方</label>
          <label><input type="radio" name="preferred-color" value="black"><span class="color-disc black">將</span>黑方</label>
        </fieldset>
        <button type="submit">開始對弈 <span>→</span></button>
        <small>建立房間後，分享連結邀請棋友加入</small>
      </form>
    </section>

    <section id="game" class="game hidden">
      <aside class="game-info">
        <div>
          <p class="eyebrow">PRIVATE MATCH</p>
          <h2 id="game-title">好友對局</h2>
          <p id="room-label" class="room-label"></p>
          <section class="side-section" aria-label="對局工具">
            <p class="side-section-title">對局工具</p>
            <div class="side-tool-grid">
              <button id="copy-link" class="secondary">複製邀請連結</button>
              <button id="sound-toggle" class="secondary" type="button" aria-pressed="true">音效：開</button>
              <button id="setup-enter" class="secondary" type="button">自訂棋局</button>
            </div>
          </section>
          <div class="side-section in-game-color" aria-label="選擇對局陣營">
            <p class="side-section-title">我的陣營</p>
            <div class="side-choice-row">
              <button id="choose-red" class="side-button red" type="button">紅方</button>
              <button id="choose-black" class="side-button black" type="button">黑方</button>
            </div>
          </div>
        </div>
        <div id="players" class="players"></div>
        <div id="undo-panel" class="undo-panel hidden" role="status">
          <p id="undo-message"></p>
          <div id="undo-response" class="undo-response hidden">
            <button id="undo-accept" class="secondary" type="button">同意</button>
            <button id="undo-reject" class="secondary" type="button">拒絕</button>
          </div>
        </div>
        <div id="replay-panel" class="replay-panel hidden">
          <p class="eyebrow">GAME RECORD</p>
          <p id="replay-label">棋譜回放</p>
          <div class="replay-buttons">
            <button id="replay-start" class="secondary" type="button">開始回放</button>
            <button id="replay-prev" class="secondary hidden" type="button">上一步</button>
            <button id="replay-next" class="secondary hidden" type="button">下一步</button>
            <button id="replay-sandbox" class="secondary hidden" type="button">從此步推演</button>
            <button id="replay-exit" class="secondary hidden" type="button">結束回放</button>
          </div>
          <div class="replay-share">
            <button id="record-copy" class="text-button" type="button">複製棋譜</button>
            <button id="record-share" class="text-button" type="button">分享棋譜</button>
          </div>
        </div>
        <div class="actions">
          <button id="undo-request" class="text-button">請求悔棋</button>
          <button id="restart" class="text-button">重新開局</button>
          <a href="/" class="text-button">離開棋局</a>
        </div>
      </aside>
      <div class="board-area">
        <div id="status" class="status">等待棋友加入…</div>
        <div id="sandbox-toolbar" class="sandbox-toolbar">
          <button id="sandbox-enter" class="secondary" type="button">沙盤推演</button>
          <div id="sandbox-controls" class="hidden">
            <button id="sandbox-prev" class="secondary" type="button">上一步</button>
            <button id="sandbox-next" class="secondary" type="button">下一步</button>
            <button id="sandbox-exit" class="secondary" type="button">退出推演</button>
          </div>
          <div id="setup-controls" class="setup-controls hidden">
            <label>棋子<select id="setup-piece">
              <option value="red:R">紅俥</option><option value="red:H">紅傌</option><option value="red:E">紅相</option><option value="red:A">紅仕</option><option value="red:K">紅帥</option><option value="red:C">紅炮</option><option value="red:P">紅兵</option>
              <option value="black:R">黑車</option><option value="black:H">黑馬</option><option value="black:E">黑象</option><option value="black:A">黑士</option><option value="black:K">黑將</option><option value="black:C">黑砲</option><option value="black:P">黑卒</option><option value="erase">橡皮擦</option>
            </select></label>
            <label>先行<select id="setup-turn"><option value="red">紅方</option><option value="black">黑方</option></select></label>
            <button id="setup-clear" class="secondary" type="button">清空</button>
            <button id="setup-standard" class="secondary" type="button">標準開局</button>
            <button id="setup-save" class="secondary" type="button">開始對弈</button>
            <button id="setup-cancel" class="secondary" type="button">取消</button>
          </div>
        </div>
        <div id="board" class="board" aria-label="中國象棋棋盤"></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
