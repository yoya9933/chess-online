<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a0f">
  <title>楚河棋局｜線上象棋與暗棋</title>
  <meta name="description" content="免註冊，開房即玩。支援標準象棋、揭棋與台灣暗棋。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .variant-choice{grid-template-columns:repeat(3,minmax(0,1fr))}
    .variant-choice label:last-child{border-color:rgba(213,173,104,.45)}
    #variant-transition{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;background:#050a0f;opacity:0;visibility:hidden;transition:opacity .35s ease}
    #variant-transition.active{opacity:1;visibility:visible}
    .variant-transition-content{text-align:center;transform:translateY(14px) scale(.94);opacity:0;transition:.45s .2s cubic-bezier(.22,1,.36,1)}
    #variant-transition.active .variant-transition-content{transform:none;opacity:1}
    .variant-transition-seal{display:grid;place-items:center;width:82px;height:82px;margin:auto;border:2px solid #bd694f;border-radius:18px;color:#dc8164;font-family:"Noto Serif TC",serif;font-size:42px;font-weight:900;box-shadow:0 0 45px rgba(189,105,79,.18)}
    .variant-transition-content p{margin:18px 0 8px;color:#d5ad68;font-size:12px;letter-spacing:.22em}.variant-transition-content h2{margin:0;font-family:"Noto Serif TC",serif;font-size:clamp(34px,7vw,62px)}
    @media(max-width:700px){.variant-choice{grid-template-columns:1fr}.variant-choice label{min-height:48px}}
    @media(prefers-reduced-motion:reduce){#variant-transition,.variant-transition-content{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/">楚河<span>棋局</span></a>
      <div id="connection" class="connection"><i></i> 連線中</div>
    </header>

    <section id="lobby" class="lobby">
      <div class="intro">
        <p class="eyebrow">ONLINE CHINESE BOARD GAMES</p>
        <h1>隔著一條楚河，<br><em>與老友再下一局。</em></h1>
        <p>免註冊、開房即玩。標準象棋、揭棋與台灣暗棋，都從同一個入口開始。</p>
        <div class="intro-features" aria-label="平台特色"><span>免註冊</span><span>三種規則</span><span>跨裝置對戰</span></div>
      </div>
      <form id="join-form" class="join-card">
        <p class="seal">弈</p>
        <h2>入局</h2>
        <fieldset class="mode-choice">
          <legend>對弈模式</legend>
          <label><input type="radio" name="game-mode" value="online" checked>線上對局</label>
          <label><input type="radio" name="game-mode" value="solo">單機對電腦</label>
        </fieldset>
        <fieldset class="mode-choice variant-choice">
          <legend>棋局規則</legend>
          <label><input type="radio" name="game-variant" value="standard" checked>標準象棋</label>
          <label><input type="radio" name="game-variant" value="jieqi">揭棋模式</label>
          <label><input type="radio" name="game-variant" value="banqi">暗棋模式</label>
        </fieldset>
        <label>你的稱呼<input id="name" maxlength="16" placeholder="例如：棋痴老王" required></label>
        <label id="room-field">房間代碼<input id="room" maxlength="6" placeholder="留空即可建立新房"></label>
        <fieldset class="color-choice">
          <legend>選擇陣營</legend>
          <label><input type="radio" name="preferred-color" value="red" checked><span class="color-disc red">帥</span>紅方</label>
          <label><input type="radio" name="preferred-color" value="black"><span class="color-disc black">將</span>黑方</label>
        </fieldset>
        <button type="submit">開始對弈 <span>→</span></button>
        <small>暗棋陣營由第一枚翻開的棋子決定</small>
      </form>
    </section>

    <section id="game" class="game hidden">
      <aside class="game-info">
        <div>
          <p class="eyebrow">PRIVATE MATCH</p>
          <h2 id="game-title">好友對局</h2>
          <p id="room-label" class="room-label"></p>
          <section class="side-section" aria-label="對局工具">
            <p class="side-section-title">對局工具</p>
            <div class="side-tool-grid">
              <button id="copy-link" class="secondary">複製邀請連結</button>
              <button id="sound-toggle" class="secondary" type="button" aria-pressed="true">音效：開</button>
              <button id="setup-enter" class="secondary" type="button">自訂棋局</button>
            </div>
          </section>
          <div class="side-section in-game-color" aria-label="選擇對局陣營">
            <p class="side-section-title">我的陣營</p>
            <div class="side-choice-row">
              <button id="choose-red" class="side-button red" type="button">紅方</button>
              <button id="choose-black" class="side-button black" type="button">黑方</button>
            </div>
          </div>
        </div>
        <div id="players" class="players"></div>
        <div id="captured-panel" class="captured-panel hidden" aria-live="polite"><p class="side-section-title">吃子紀錄</p><div id="captured-list" class="captured-list"></div><small>明子雙方可見，暗子真身僅吃子方可見</small></div>
        <div id="undo-panel" class="undo-panel hidden" role="status"><p id="undo-message"></p><div id="undo-response" class="undo-response hidden"><button id="undo-accept" class="secondary" type="button">同意</button><button id="undo-reject" class="secondary" type="button">拒絕</button></div></div>
        <div id="replay-panel" class="replay-panel hidden"><p class="eyebrow">GAME RECORD</p><p id="replay-label">棋譜回放</p><div class="replay-buttons"><button id="replay-start" class="secondary" type="button">開始回放</button><button id="replay-prev" class="secondary hidden" type="button">上一步</button><button id="replay-next" class="secondary hidden" type="button">下一步</button><button id="replay-sandbox" class="secondary hidden" type="button">從此步推演</button><button id="replay-exit" class="secondary hidden" type="button">結束回放</button></div><div class="replay-share"><button id="record-copy" class="text-button" type="button">複製棋譜</button><button id="record-share" class="text-button" type="button">分享棋譜</button></div></div>
        <div class="actions"><button id="undo-request" class="text-button">請求悔棋</button><button id="restart" class="text-button">重新開局</button><a href="/" class="text-button">離開棋局</a></div>
      </aside>
      <div class="board-area">
        <div id="status" class="status">等待棋友加入…</div>
        <div id="sandbox-toolbar" class="sandbox-toolbar">
          <button id="sandbox-enter" class="secondary" type="button">沙盤推演</button>
          <div id="sandbox-controls" class="hidden"><button id="sandbox-prev" class="secondary" type="button">上一步</button><button id="sandbox-next" class="secondary" type="button">下一步</button><button id="sandbox-exit" class="secondary" type="button">退出推演</button></div>
          <div id="setup-controls" class="setup-controls hidden">
            <label>棋子<select id="setup-piece"><option value="red:R">紅俥</option><option value="red:H">紅傌</option><option value="red:E">紅相</option><option value="red:A">紅仕</option><option value="red:K">紅帥</option><option value="red:C">紅炮</option><option value="red:P">紅兵</option><option value="black:R">黑車</option><option value="black:H">黑馬</option><option value="black:E">黑象</option><option value="black:A">黑士</option><option value="black:K">黑將</option><option value="black:C">黑砲</option><option value="black:P">黑卒</option><option value="erase">橡皮擦</option></select></label>
            <label>先行<select id="setup-turn"><option value="red">紅方</option><option value="black">黑方</option></select></label>
            <button id="setup-clear" class="secondary" type="button">清空</button><button id="setup-standard" class="secondary" type="button">標準開局</button><button id="setup-save" class="secondary" type="button">開始對弈</button><button id="setup-cancel" class="secondary" type="button">取消</button>
          </div>
        </div>
        <div id="board" class="board" aria-label="中國象棋棋盤"></div>
      </div>
    </section>
  </main>

  <div id="variant-transition" aria-hidden="true"><div class="variant-transition-content"><div class="variant-transition-seal">暗</div><p>ENTERING BANQI</p><h2>翻子定局</h2></div></div>
  <div id="toast" class="toast"></div>
  <script>
    document.getElementById("join-form").addEventListener("submit", function(event) {
      const variant = document.querySelector('input[name="game-variant"]:checked')?.value;
      if (variant !== "banqi") return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const mode = document.querySelector('input[name="game-mode"]:checked')?.value === "solo" ? "local" : "online";
      const name = document.getElementById("name").value.trim();
      const room = document.getElementById("room").value.trim().toUpperCase();
      const params = new URLSearchParams({ mode, name, autostart: "1" });
      if (room) params.set("room", room);
      const overlay = document.getElementById("variant-transition");
      overlay.classList.add("active");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.setTimeout(() => location.href = `/banqi.html?${params}`, reduced ? 30 : 720);
    }, true);
  </script>
  <script src="/app.js"></script>
</body>
</html>
