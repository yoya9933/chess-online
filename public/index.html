<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191713">
  <title>楚河棋局｜線上象棋</title>
  <meta name="description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta property="og:title" content="楚河棋局｜線上象棋">
  <meta property="og:description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/index.html">
  <meta property="og:image" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="楚河棋局｜線上象棋">
  <meta name="twitter:description" content="與老友，再下一局。免註冊，打開網頁就能下的中國象棋。">
  <meta name="twitter:image" content="https://chuhe-xiangqi-online.bowersbayley13783.chatgpt.site/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/">楚河<span>棋局</span></a>
      <div id="connection" class="connection"><i></i> 連線中</div>
    </header>

    <section id="lobby" class="lobby">
      <div class="intro">
        <p class="eyebrow">ONLINE XIANGQI</p>
        <h1>隔著一條楚河，<br><em>與老友再下一局。</em></h1>
        <p>免註冊、開房即玩。把房間連結傳給朋友，落子之間，重拾面對面對弈的從容。</p>
      </div>
      <form id="join-form" class="join-card">
        <p class="seal">弈</p>
        <h2>入局</h2>
        <label>你的稱呼<input id="name" maxlength="16" placeholder="例如：棋痴老王" required></label>
        <label>房間代碼<input id="room" maxlength="6" placeholder="留空即可建立新房"></label>
        <button type="submit">開始對弈 <span>→</span></button>
        <small>建立房間後，分享連結邀請棋友加入</small>
      </form>
    </section>

    <section id="game" class="game hidden">
      <aside class="game-info">
        <div>
          <p class="eyebrow">PRIVATE MATCH</p>
          <h2>好友對局</h2>
          <p id="room-label" class="room-label"></p>
          <button id="copy-link" class="secondary">複製邀請連結</button>
        </div>
        <div id="players" class="players"></div>
        <div class="actions">
          <button id="restart" class="text-button">重新開局</button>
          <a href="/" class="text-button">離開棋局</a>
        </div>
      </aside>
      <div class="board-area">
        <div id="status" class="status">等待棋友加入…</div>
        <div id="board" class="board" aria-label="中國象棋棋盤"></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
